<!doctype html>
<html lang="de">
<head>
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:">
<title>SSH Deck</title>
<script src="./boot.js"></script>
<style>
  /* Start-Animation: reines HTML/CSS, sichtbar bevor das Bundle geladen ist */
  html { background: #fff; } html.dark { background: #0a0a0a; }
  body { margin: 0; }
  .splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #fff; color: #18181b;
    -webkit-app-region: drag; transition: opacity .35s ease; --tile: #2563eb; --glyph: #fff; --glow: #2563eb55; }
  html.dark .splash { background: #0a0a0a; color: #f5f5f5; --tile: #f5f5f5; --glyph: #0a0a0a; --glow: #ffffff33; }
  .splash.hide { opacity: 0; pointer-events: none; }
  .splash .logo { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .splash svg { width: 120px; height: 120px; overflow: visible; }
  .splash .card { transform-box: view-box; transform-origin: 256px 452px; }
  .splash .c1 { animation: fan1 .7s .15s cubic-bezier(.2, 1.2, .4, 1) both; }
  .splash .c2 { animation: fan2 .7s .1s cubic-bezier(.2, 1.2, .4, 1) both; }
  .splash .c3 { animation: pop .55s cubic-bezier(.2, 1.4, .4, 1) both; }
  .splash .chev { fill: none; stroke: url(#sgp); stroke-width: 36; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .4s .45s ease-out forwards; }
  .splash .cur { opacity: 0; animation: cur .25s .8s ease-out forwards, blink .9s 1.1s steps(1) infinite; }
  .splash .name { font: 600 22px/1 system-ui, sans-serif; letter-spacing: .02em; opacity: 0; transform: translateY(6px); animation: rise .45s .5s ease-out forwards; }
  @keyframes pop { from { transform: scale(.55); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fan1 { from { transform: rotate(0); opacity: 0; } to { transform: rotate(21deg); opacity: 1; } }
  @keyframes fan2 { from { transform: rotate(0); opacity: 0; } to { transform: rotate(10.5deg); opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes cur { from { opacity: 0; } to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .splash *, .splash { animation-duration: .01s !important; animation-delay: 0s !important; } }
</style>
</head>
<body>
<div id="splash" class="splash" aria-hidden="true">
  <div class="logo">
    <svg viewBox="90 50 350 430">
      <defs>
        <linearGradient id="sgm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5fa2" /><stop offset="1" stop-color="#ff9a5a" /></linearGradient>
        <linearGradient id="sgc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ec4ff" /><stop offset="1" stop-color="#4f7bff" /></linearGradient>
        <linearGradient id="sgf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a5cff" /><stop offset="1" stop-color="#4f7bff" /></linearGradient>
        <linearGradient id="sgp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" /><stop offset="1" stop-color="#9fe3ff" /></linearGradient>
      </defs>
      <rect class="card c1" x="130" y="82" width="252" height="326" rx="50" fill="url(#sgm)" />
      <rect class="card c2" x="130" y="82" width="252" height="326" rx="50" fill="url(#sgc)" />
      <g class="card c3">
        <rect x="130" y="82" width="252" height="326" rx="50" fill="url(#sgf)" />
        <rect x="146" y="98" width="220" height="294" rx="36" fill="#0e1020" />
      </g>
      <path class="chev" pathLength="1" d="M196 206 L262 262 L196 318" />
      <rect class="cur" x="282" y="312" width="68" height="30" rx="15" fill="url(#sgm)" />
    </svg>
    <div class="name">SSH Deck</div>
  </div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
