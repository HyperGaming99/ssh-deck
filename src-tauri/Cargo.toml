[package]
name = "ssh-deck"
version = "0.1.8"
description = "SSH client with SFTP, keychain and themes"
authors = ["HyperGaming99"]
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
libdbus-sys = { version = "0.2.7", features = ["vendored"] }
tokio = { version = "1", features = ["net", "time", "rt", "sync"] }
portable-pty = "0.9.0"
