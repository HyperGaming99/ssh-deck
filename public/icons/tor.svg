<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="torPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9c5db7" />
      <stop offset="50%" stop-color="#7d4698" />
      <stop offset="100%" stop-color="#54256c" />
    </linearGradient>
    <linearGradient id="torSprout" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#569926" />
      <stop offset="100%" stop-color="#84cc37" />
    </linearGradient>
    <filter id="torGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7d4698" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Sprout / Stem -->
  <path d="M24 3 C24 3, 26 8, 28 10 C29 11, 31 11, 33 10 C32 12, 29 14, 26 13 C24.5 12.5, 24 10, 24 8 Z" fill="url(#torSprout)" />
  <path d="M23 4 C23 4, 21 8, 19 9.5 C18 10.2, 16 10.5, 14 10 C15.5 11.5, 18 12.5, 20.5 12 C22 11.5, 22.8 9.5, 23 8 Z" fill="url(#torSprout)" />
  <!-- Main Onion Body -->
  <path d="M24 9 C14 9, 7 17, 7 27 C7 36, 15 44, 24 45 C33 44, 41 36, 41 27 C41 17, 34 9, 24 9 Z" fill="url(#torPurple)" filter="url(#torGlow)" />
  <!-- Onion Layer 1 (Outer Arc) -->
  <path d="M24 13 C16.5 13, 11 19.5, 11 27 C11 34.5, 16.5 41, 24 41" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9" />
  <!-- Onion Layer 2 (Middle Arc) -->
  <path d="M24 17.5 C18.8 17.5, 15 21.8, 15 27 C15 32.2, 18.8 36.5, 24 36.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9" />
  <!-- Onion Layer 3 (Inner Arc) -->
  <path d="M24 22 C21.2 22, 19 24.2, 19 27 C19 29.8, 21.2 32, 24 32" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.95" />
  <!-- Core / Heart of the onion -->
  <circle cx="24" cy="27" r="2.2" fill="#ffffff" />
  <!-- Root tuft -->
  <path d="M22 45 L21 47 M24 45 L24 47.5 M26 45 L27 47" stroke="#9c5db7" stroke-width="1.2" stroke-linecap="round" />
</svg>