name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches-ignore: [dev, main] # dev und main bauen im Workflow "Build & Release"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
