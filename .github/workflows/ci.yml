name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches-ignore: [dev, main] # dev und main bauen im Workflow "Build & Release"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: node --test tests/*.test.cjs
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib hostkeys::tests
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib updates::tests
