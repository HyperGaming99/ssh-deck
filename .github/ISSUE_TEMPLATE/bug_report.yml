name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: What did you expect instead?, placeholder: Describe the problem }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, placeholder: "1. Open …\n2. Click …\n3. See error" }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: SSH Deck version, description: Settings → Updates, placeholder: "0.1.1" }
    validations: { required: true }
  - type: dropdown
    id: os
    attributes: { label: Operating system, options: [Linux, Windows, macOS] }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Terminal, Themes, SFTP, Keychain, Known hosts, Port forwarding, Host import, Cloud sync, Tor, Updater, Other]
  - type: textarea
    id: logs
    attributes: { label: Logs / screenshots, description: "Copy the connection log (Show logs) if a connection failed. Remove passwords and host names you do not want to share.", render: shell }
