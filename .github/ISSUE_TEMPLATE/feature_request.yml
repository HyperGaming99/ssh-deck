name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve?, placeholder: "I often have to …" }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Your idea, placeholder: Describe how it could work }
    validations: { required: true }
  - type: textarea
    id: alt
    attributes: { label: Alternatives you considered }
